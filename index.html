<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0c0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moira">
<meta name="description" content="Moira: restore the silenced Oracle at Delphi by living through twelve Greek myths.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Moira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one full-screen stage; each screen is a stacked layer. A ruined
   tunnel lit by teal (restored), gold (threads) and ember (danger / Tier IV). */
:root{
  --night:#0c0e11; --stone:#191c20; --stone-2:#262a2f; --stone-3:#363b41;
  --ash:#979c9f; --bone:#ece5d6; --teal:#41cfbf; --teal-dim:#1f6b63;
  --gold:#e4b64b; --gold-dim:#7d6328; --ember:#e8743b; --blood:#c24a3a;
  --f-display:"Marcellus SC","Cinzel",Georgia,serif;
  --f-body:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--bone);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll-y{overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.04em;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,11vw,76px);letter-spacing:.18em}
h2{font-size:26px}
h3{font-size:19px}
p{margin:0}
.label{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.muted{color:var(--ash)}
.gold{color:var(--gold)} .teal{color:var(--teal)} .ember{color:var(--ember)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-ui);font-weight:500;font-size:16px;letter-spacing:.03em;border:1px solid var(--stone-3);background:var(--stone);padding:11px 18px;border-radius:3px;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ash)}
.btn.primary{background:var(--teal);color:#06231f;border-color:var(--teal);font-weight:700}
.btn.primary:hover{background:#5fe0d1}
.btn.gilt{border-color:var(--gold-dim);color:var(--gold)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
input[type=text],input[type=password],input[inputmode]{font:inherit;font-family:var(--f-ui);background:var(--stone);color:var(--bone);border:1px solid var(--stone-3);border-radius:3px;padding:11px 12px;min-height:44px;width:100%}
.carved{background:linear-gradient(#22262b,#16191c);border:1px solid #31363c;box-shadow:inset 0 1px 0 #3a4047,inset 0 -2px 0 #0a0b0d,0 6px 24px #0008}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--stone-2);border:1px solid var(--gold-dim);color:var(--bone);padding:10px 16px;border-radius:3px;font-family:var(--f-ui);z-index:90;max-width:min(90vw,440px);text-align:center}
.glyph{width:1em;height:1em;display:inline-block;vertical-align:-.15em}
.glyph path{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- intro ---------- */
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .center{position:relative;background:radial-gradient(closest-side,#0c0e11cc,#0c0e1100);margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:24px}
.whisper{font-style:italic;font-size:22px;color:var(--gold);opacity:0;animation:fadein 2.4s 1.2s forwards}
.intro-actions{opacity:0;animation:fadein 1.2s 3.2s forwards;display:flex;flex-direction:column;gap:10px;width:min(300px,80vw)}
@keyframes fadein{to{opacity:1}}
#introLogo{width:min(180px,42vw);height:auto;border-radius:50%;box-shadow:0 0 40px #e4b64b33;opacity:0;animation:fadein 2s .1s forwards}
#intro h1{color:var(--bone);text-shadow:0 0 24px #e4b64b55;opacity:0;animation:fadein 2s .2s forwards}

/* ---------- create / oath ---------- */
.ritual{padding-block:28px 40px}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--stone);border:1px solid var(--stone-3);border-radius:3px;padding:12px;min-width:0}
.choice[aria-pressed=true]{border-color:var(--gold);background:#2a2516}
.choice .name{font-family:var(--f-display);font-size:19px}
.choice .gift{font-family:var(--f-ui);font-size:14px;color:var(--ash)}
.emblems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.emblems .choice{align-items:center;font-size:44px;padding:14px 6px;color:var(--gold)}
.emblems .choice span{font-size:13px;font-family:var(--f-ui);color:var(--ash)}
.oath{font-style:italic;font-size:19px;border-left:2px solid var(--gold-dim);padding-left:14px}
.sealcode{font-family:var(--f-display);font-size:clamp(22px,6vw,32px);color:var(--gold);letter-spacing:.06em;padding:16px;text-align:center;border:1px dashed var(--gold-dim);user-select:all;overflow-wrap:anywhere}
#know{align-items:center;justify-content:center;text-align:center;gap:18px;background:radial-gradient(circle at 50% 45%,#1c1a14,var(--night) 70%)}
#know .greek{font-family:var(--f-display);font-size:clamp(30px,9vw,56px);letter-spacing:.2em;color:var(--gold);min-height:1.3em}
#know .eng{font-size:22px;min-height:1.5em}
#know .hint{font-style:italic;color:var(--ash);min-height:3em;max-width:30ch}
.scroll-unroll{position:fixed;inset:0;z-index:80;pointer-events:none;display:flex;align-items:center;justify-content:center}
.scroll-unroll .paper{width:min(80vw,420px);height:0;background:linear-gradient(90deg,#b99a62,#e8d6a8 20%,#efe0b8 50%,#e8d6a8 80%,#b99a62);box-shadow:0 0 60px #e4b64b66;transition:height .9s ease-out}
.scroll-unroll.open .paper{height:70vh}
.scroll-unroll.pull .paper{transform:scale(8);opacity:0;transition:transform .9s ease-in,opacity .9s ease-in}

/* ---------- hub ---------- */
#hub{background:#07080a}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;border-bottom:1px solid #2b3036;background:linear-gradient(#1f2327,#141619)}
.topbar .title{font-family:var(--f-display);font-size:16px;letter-spacing:.1em}
.counters{display:flex;gap:12px;font-family:var(--f-ui);font-size:14px;font-variant-numeric:tabular-nums}
.raven-msg{position:relative;margin-top:8px;background:#0d1312ee;border:1px solid var(--teal-dim);border-left:3px solid var(--teal);padding:8px 36px 8px 12px;font-family:var(--f-ui);font-size:15px;border-radius:2px}
.raven-msg .x{position:absolute;right:4px;top:2px;background:none;border:0;font-size:20px;width:32px;height:32px;color:var(--ash)}
#tunnel{flex:1;min-height:0;position:relative}
#tunnel canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.raven-btn{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;border:1px solid #333a40;background:#0e1113cc;color:var(--bone);font-size:30px;display:flex;align-items:center;justify-content:center}
.console{margin-block:8px;padding:12px 14px;border-radius:4px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center}
.console .arrow{width:48px;height:48px;border-radius:50%;background:#14171a;border:1px solid #3a4047;font-size:22px}
.console .mid{min-width:0;text-align:center}
.console .pnum{font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;color:var(--ash);font-variant-numeric:tabular-nums}
.console .pname{font-family:var(--f-display);font-size:20px;line-height:1.2}
.tier{font-family:var(--f-ui);font-size:13px;color:var(--ash);display:flex;justify-content:center;gap:6px;align-items:center}
.tier i{width:8px;height:8px;border-radius:50%;background:#2c3136;display:inline-block}
.tier i.on{background:var(--teal);box-shadow:0 0 6px var(--teal)}
.tier.iv i.on{background:var(--ember);box-shadow:0 0 6px var(--ember)}
.console .enter{grid-column:1/-1;display:flex;gap:8px}
.console .enter .btn{flex:1}
.bottommenu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:0 10px}
.bottommenu .btn{display:flex;align-items:center;justify-content:center;gap:8px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:1px solid var(--stone-3)}
.ov-body{flex:1;min-height:0;overflow-y:auto;padding-block:16px 32px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs button{flex:none;background:none;border:1px solid var(--stone-3);border-radius:20px;padding:6px 14px;font-family:var(--f-ui);font-size:14px;min-height:36px}
.tabs button[aria-selected=true]{border-color:var(--gold);color:var(--gold)}
.mythtext{font-size:17px;max-width:65ch}
.flipcard{perspective:1000px;height:260px;cursor:pointer}
.flipcard .inner{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flipcard.flipped .inner{transform:rotateY(180deg)}
.flipcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:4px;gap:10px}
.flipcard .front{background:linear-gradient(160deg,#e8d9b2,#cdb684);color:#2b2212}
.flipcard .front h3{font-size:28px}
.flipcard .back{background:#1d2024;border:1px solid var(--stone-3);transform:rotateY(180deg);font-size:18px}
.threadhint{font-family:var(--f-ui);font-size:14px;color:var(--gold);border-top:1px solid var(--gold-dim);padding-top:8px}
.match-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px}
.tile{background:var(--stone);border:1px solid var(--stone-3);border-radius:3px;padding:10px;text-align:left;font-family:var(--f-ui);font-size:14px;min-height:48px;min-width:0}
.tile.sel{border-color:var(--gold);background:#2a2516}
.tile.ok{border-color:var(--teal-dim);color:var(--ash);background:#10201e;opacity:.6}
.tile.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.orderlist{display:flex;flex-direction:column;gap:8px}
.orderlist .tile{display:flex;gap:10px;align-items:center}
.orderlist .num{font-family:var(--f-display);color:var(--gold);min-width:1.2em}
.quizopt{display:flex;flex-direction:column;gap:8px}
.quizopt .tile{font-size:16px}
.meter{height:10px;background:#1a1d20;border:1px solid var(--stone-3);border-radius:6px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
.meter.gold>i{background:var(--gold)} .meter.ember>i{background:var(--ember)}
.journal-myth{border-top:1px solid var(--stone-3);padding-top:12px}
.journal-card{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 12px;font-size:15px;padding:6px 0;border-bottom:1px dotted #2b2f34}
.journal-card b{font-family:var(--f-ui);font-weight:700}
.threadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.threadgrid .t{border:1px solid var(--stone-3);padding:10px;border-radius:3px;font-family:var(--f-ui);font-size:14px;display:flex;flex-direction:column;gap:4px}
.threadgrid .t.found{border-color:var(--gold-dim);background:#211d10}
.slot{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.slot .em{font-size:34px;color:var(--gold)}
.modal-bg{position:fixed;inset:0;background:#000b;z-index:85;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--stone);border:1px solid var(--stone-3);border-radius:4px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}

/* ---------- vision ---------- */
#vision{background:#000}
.v-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;background:#0f1113;border-bottom:1px solid #2a2e33;z-index:5}
.v-top .ph{font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.v-body{flex:1;min-height:0;position:relative;overflow:hidden}
.has-inv .v-caption{bottom:73px}
.v-caption{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,#000d 40%);font-size:16px;pointer-events:none}
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:radial-gradient(circle,#1a1712,#000 75%);z-index:20;padding:24px}
.titlecard .label{color:var(--gold)}
.titlecard p{max-width:34ch;font-style:italic}
.hud{position:absolute;top:8px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:6;font-family:var(--f-ui);font-size:14px}
.chip{background:#000a;border:1px solid #3a4047;border-radius:14px;padding:4px 10px}
.goldglint{animation:glint 2.6s infinite}
@keyframes glint{0%,80%,100%{filter:none}88%{filter:drop-shadow(0 0 4px #ffd36b) brightness(1.4)}}
.artemis .goldglint{animation-duration:1.3s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
/* ---------- Panel 1: Hermes ---------- */
.cave{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,#3a2d1e 0%,#1d1711 45%,#0a0806 80%),#0a0806}
.cave::before{content:"";position:absolute;left:30%;right:30%;top:0;height:38%;background:radial-gradient(ellipse at 50% 0%,#e7c98b55,transparent 70%)}
.hot{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle,#00000000 40%,#0000);color:#8d7b5f;font-size:52px;display:flex;align-items:center;justify-content:center;transition:color .2s,filter .2s}
.hot:hover{color:#d9c49a;filter:drop-shadow(0 0 6px #e4b64b88)}
.hot.pulse{animation:hintpulse 1s 4}
@keyframes hintpulse{50%{color:#41cfbf;filter:drop-shadow(0 0 10px #41cfbf)}}
.hot .lbl{position:absolute;top:100%;font-family:var(--f-ui);font-size:12px;color:#a8977a;white-space:nowrap}
.decor{position:absolute;transform:translate(-50%,-50%);color:#4d3f2c;pointer-events:none}
.inv{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px;background:#000c;border-top:1px solid #3a2f22;z-index:4}
.inv .it{width:52px;height:52px;border:1px solid #5a4a33;border-radius:4px;background:#1c1610;color:var(--gold);font-size:38px;display:flex;align-items:center;justify-content:center;position:relative}
.inv .it .n{position:absolute;bottom:1px;right:3px;font-family:var(--f-ui);font-size:11px;color:var(--bone)}
.inv .it.empty{opacity:.25}
.closeup{position:absolute;inset:0;z-index:8;background:#0b0907f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.loom{display:flex;flex-direction:column;gap:12px;width:min(420px,90%);padding:18px;border:6px solid #4a3a26;border-radius:4px;background:#17120c}
.loom button{height:24px;border:0;background:transparent;position:relative;padding:0}
.loom button::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:var(--c,#a1957f);border-radius:2px}
.loom button.sel::after{height:5px;box-shadow:0 0 8px #e9e3d6}
.loom button.sel{outline:1px dashed #6b5a3b}
.lyre-build{width:min(240px,60vw);height:auto;color:var(--gold)}
.lyre-build path{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;opacity:.12;transition:opacity .4s}
.lyre-build path.on{opacity:1}
/* night grid */
.night{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 0%,#1d2a3b,#090d14 70%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 10px 24px;overflow-y:auto}
.grid9{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:min(100%,520px);aspect-ratio:9/7;max-width:100%}
.cell{position:relative;background:#22331f;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:clamp(9px,2.4vw,15px);min-width:0;overflow:hidden}
.cell.mud{background:#3d2c1c}
.cell.rock{background:#2b2f33}
.cell.rock::after{content:"";width:60%;height:50%;border-radius:45%;background:#555b60}
.cell.vine{background:repeating-linear-gradient(90deg,#1c3a18 0 6px,#122410 6px 10px)}
.cell.cave{background:#0a0a0a;box-shadow:inset 0 0 0 2px #7d6328}
.cell.seen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#e8743b88 0 3px,#e8743b22 3px 7px);box-shadow:inset 0 0 0 1px #e8743b}
.cell.hintp{box-shadow:inset 0 0 0 2px var(--teal)}
.cell .pr{position:absolute;color:#c7b48a99;font-size:1.2em;line-height:1}
.cell .tok{position:relative;z-index:2;width:72%;height:72%;border-radius:50%;background:var(--gold);color:#2a1d05;display:flex;align-items:center;justify-content:center;font-weight:700}
.cell .cow{position:relative;z-index:1;width:46%;height:40%;border-radius:40%;background:#e9e3d6;opacity:.85}
.cell .man{position:relative;z-index:2;width:70%;height:70%;border-radius:50%;background:#e9e3d6;color:#222;display:flex;align-items:center;justify-content:center;font-weight:700}
.pad3{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pad3 .btn{padding:0;min-height:52px;font-size:20px}
.ctrls{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;width:min(100%,520px)}
.toggles{display:flex;flex-direction:column;gap:6px;min-width:0}
.tog{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:14px;background:var(--stone);border:1px solid var(--stone-3);border-radius:3px;padding:8px 10px;min-height:44px;text-align:left}
.tog[aria-pressed=true]{border-color:var(--teal);color:var(--teal)}
.tog .sw{width:30px;height:16px;border-radius:9px;background:#3a3f45;position:relative;flex:none}
.tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#bbb;transition:left .15s}
.tog[aria-pressed=true] .sw{background:var(--teal-dim)}
.tog[aria-pressed=true] .sw::after{left:16px;background:var(--teal)}
/* river feast */
.river{position:absolute;inset:0;background:linear-gradient(#0b1018,#14100b 60%,#1d140b);overflow-y:auto;padding:52px 12px 80px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fire{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#e8743b var(--f,0%),#2a1a0e calc(var(--f,0%) + 10%),transparent 70%);transition:background .1s}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;width:min(100%,560px)}
.plates .tile{text-align:center;font-size:13px;padding:6px}
.door{position:relative;width:min(100%,420px);height:120px;background:#2a1f14;border:4px solid #4a3a26;border-radius:4px;overflow:hidden}
.door .keyhole{position:absolute;left:50%;top:50%;width:var(--w,26px);height:52px;transform:translate(-50%,-50%);background:#000;border-radius:13px 13px 3px 3px;box-shadow:0 0 0 2px #7d6328}
.door .mist{position:absolute;top:50%;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#e9e3d6cc,#e9e3d600 70%)}
/* olympus */
.olympus{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#3b3324,#120f0a 70%);overflow-y:auto;padding:52px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.speech{width:min(100%,560px);background:#1b1813;border:1px solid #4a3f2c;border-radius:4px;padding:12px 14px}
.speech b{font-family:var(--f-display);font-weight:400;color:var(--gold)}
.lyre-play{display:flex;gap:6px;justify-content:center;padding:16px 18px 10px;border:5px solid #7d6328;border-top-width:10px;border-radius:40px 40px 8px 8px;background:#140f09}
.lyre-play button{width:34px;height:180px;border:0;background:transparent;position:relative}
.lyre-play button::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:#cdb98d;border-radius:2px;transition:background .1s,box-shadow .1s}
.lyre-play button.lit::after{background:var(--gold);box-shadow:0 0 12px var(--gold);width:5px}
/* ---------- shared vision scenes ---------- */
.scene{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 12px 24px}
.scene > *{max-width:100%;flex-shrink:0}
.scene .info{text-align:center;max-width:40ch;color:var(--ash)}
.cap-slot{width:min(100%,560px);min-height:3em;font-size:16px;text-align:center}
.bigbtn{min-width:200px;min-height:56px;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-family:var(--f-ui);font-size:14px}
/* ---------- Panel 2: Argus ---------- */
.argos{background:linear-gradient(#6d8fb0 0%,#a9bfd0 38%,#5f7a3f 38.5%,#3f5a2a 100%)}
.pasture{position:relative;width:min(100%,560px);aspect-ratio:4/3;border-radius:6px;background:radial-gradient(ellipse at 30% 30%,#6f8a45,#45612c 70%);box-shadow:inset 0 0 40px #0006;overflow:hidden}
.pasture.clouded::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#fffe,#fff8 40%,#fff0 70%),radial-gradient(circle at 70% 60%,#fffd,#fff7 35%,#fff0 65%);pointer-events:all}
.heifer{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;padding:0}
.heifer .body{width:44px;height:26px;border-radius:45% 50% 40% 40%;background:#f2efe6;box-shadow:inset -4px -3px 0 #d8d2c2;position:relative}
.heifer .body::before{content:"";position:absolute;right:-9px;top:-4px;width:14px;height:13px;border-radius:40%;background:#f2efe6}
.heifer .mark{font-family:var(--f-display);font-size:13px;color:#2f2516;letter-spacing:.1em;margin-top:3px;opacity:.75;white-space:nowrap}
.heifer:hover .body{box-shadow:inset -4px -3px 0 #d8d2c2,0 0 0 2px #e4b64b}
.eyewarn{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000c;color:var(--ember);border:1px solid var(--ember);padding:6px 12px;border-radius:3px;font-family:var(--f-ui);font-size:15px;z-index:3;white-space:nowrap}
.hillside{position:relative;width:min(100%,560px);aspect-ratio:4/3;border-radius:6px;background:linear-gradient(170deg,#8aa05a,#4d6a30);overflow:hidden}
.hillside .item{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:#0004;border-radius:6px;padding:6px 8px;color:#f6efdc;font-family:var(--f-ui);font-size:12px;min-width:56px}
.hillside .item svg{width:32px;height:32px}
.hillside .goat{position:absolute;width:30px;height:20px;border-radius:50%;background:#efe7d4;border:2px solid #6b5a3b;transition:left 1.2s linear,top 1.2s linear;transform:translate(-50%,-50%)}
.bundle{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:40px}
.bundle span{background:var(--stone-2);border:1px solid var(--stone-3);border-radius:14px;padding:4px 10px;font-family:var(--f-ui);font-size:13px}
.giant{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:min(100%,480px);padding:12px;border-radius:40% 40% 12px 12px;background:radial-gradient(ellipse at 50% 30%,#4a3b2b,#241a12)}
.cluster{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:6px 4px;border-radius:8px;background:#0003;min-width:0}
.cluster i{width:12px;height:8px;border-radius:50%;background:#41cfbf;box-shadow:0 0 5px #41cfbf;display:block;transition:all .3s}
.cluster.shut i{height:2px;background:#6b5a3b;box-shadow:none;margin-top:3px}
.cluster.current{outline:1px dashed var(--gold)}
.cluster.special i{width:22px;height:14px;background:var(--ember);box-shadow:0 0 8px var(--ember)}
.cluster.special.shut i{height:2px;background:#6b5a3b;box-shadow:none}
.pipes{display:flex;gap:6px;align-items:flex-start;padding:10px;background:#2a1f12;border-radius:6px}
.pipes button{width:44px;border:2px solid #8a6a3a;background:linear-gradient(90deg,#c9a560,#e8cc8a,#b8914a);border-radius:0 0 8px 8px;transition:filter .1s}
.pipes button.lit{filter:brightness(1.5) drop-shadow(0 0 8px var(--gold))}
.sneak{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:min(100%,520px)}
.sneak button{aspect-ratio:1;border:0;border-radius:3px;background:#4c6a2e;position:relative;font-size:18px;color:#3a2a14;min-width:0;padding:0}
.sneak button.twig::after{content:"⟋";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6b5634;opacity:.75}
.sneak button.here{background:var(--gold)}
.sneak button.goal{background:#e9e3d6}
.sneak button.stepped{background:#3a5222}
.sneak button.near{box-shadow:inset 0 0 0 2px #e9e3d655}
.rope{position:relative;width:min(100%,460px);height:150px;background:#3b2a19;border-radius:6px}
.rope .strand{position:absolute;left:4%;right:4%;height:6px;border-radius:3px;background:#a68a5c}
.rope .knot{position:absolute;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #7a6040;background:#a68a5c;font-family:var(--f-ui);font-size:12px;color:#2a1d0c;font-weight:700}
.rope .goldstrand{position:absolute;left:10%;right:10%;top:62%;height:12px;border:0;background:transparent;padding:0}
.rope .goldstrand::after{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:#cdb06a;opacity:.8}
/* ---------- Panel 3: Daedalus ---------- */
.workshop{background:linear-gradient(#2a2016,#17110b)}
.bench{position:relative;width:min(100%,560px);aspect-ratio:4/3;border-radius:6px;background:repeating-linear-gradient(0deg,#3a2a1a 0 22px,#33251a 22px 24px);overflow:hidden}
.bench .thing{position:absolute;transform:translate(-50%,-50%);border:1px solid #6b5a3b;background:#1d150dcc;border-radius:4px;padding:6px 8px;font-family:var(--f-ui);font-size:13px;color:#efe3c6;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.bench .thing svg{width:28px;height:28px;color:var(--gold)}
.bench .thing.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.hides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(100%,560px)}
.hides button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.hides small{color:var(--ash);font-size:12px}
.shellview{width:min(100%,320px);aspect-ratio:1;position:relative}
.shellview canvas{width:100%;height:100%}
.shellview .spot{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed #e4b64b88;background:#0000}
.corridor{position:relative;width:min(100%,520px);height:110px;background:linear-gradient(#2c241b,#1a140e);border-radius:6px;overflow:hidden;border:1px solid #4a3a26}
.corridor .floor{position:absolute;left:0;right:0;bottom:0;height:30px;background:repeating-linear-gradient(90deg,#3a2e22 0 30px,#30261c 30px 32px)}
.corridor .me,.corridor .guard,.corridor .goalx{position:absolute;bottom:22px;transform:translateX(-50%);font-family:var(--f-ui);font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:50%}
.corridor .me{width:30px;height:30px;background:var(--gold);color:#2a1d05;transition:left .1s linear}
.corridor .guard{width:34px;height:34px;background:#9c3d2e;color:#fff}
.corridor .guard.watching{box-shadow:-60px 0 40px 10px #e8743b55}
.corridor .goalx{width:34px;height:34px;border:2px dashed var(--teal);color:var(--teal);font-size:11px}
.maze{display:grid;gap:0;width:min(100%,420px);aspect-ratio:1;background:#e7d6b0;border-radius:28px 28px 60px 28px;padding:16px;box-shadow:inset 0 0 30px #8a6a3a}
.maze button{border:0;background:transparent;padding:0;position:relative;min-width:0}
.maze button.wt{border-top:2px solid #6b4a24}.maze button.wb{border-bottom:2px solid #6b4a24}
.maze button.wl{border-left:2px solid #6b4a24}.maze button.wr{border-right:2px solid #6b4a24}
.maze button.thr::before{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--thr,#a68a5c)}
.maze button.honey::after{content:"";position:absolute;inset:26%;border-radius:50%;background:#e4a52b;box-shadow:0 0 6px #e4a52b}
.maze button.ant::after{content:"";position:absolute;inset:22%;border-radius:50%;background:#1a1a1a}
.maze button.exit{background:#41cfbf44}
.maze button.start{background:#e4b64b44}
.spools{display:flex;gap:12px;justify-content:center}
.spools button{width:56px;height:70px;border:0;border-radius:6px;background:linear-gradient(90deg,#5a4026,#7a5a36,#5a4026);position:relative}
.spools button::after{content:"";position:absolute;left:8px;right:8px;top:14px;bottom:14px;border-radius:3px;background:repeating-linear-gradient(0deg,var(--c) 0 2px,#0002 2px 4px)}
.gears{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.gears button{width:86px;height:86px;border-radius:50%;border:0;background:transparent;padding:0}
.gears svg{width:100%;height:100%;transition:transform .35s}

</style>

</head>
