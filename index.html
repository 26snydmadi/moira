<script>
"use strict";
const MYTHS=[{"n": 1, "name": "Hermes and Apollo's Cattle", "tier": 1, "tierName": "Initiate", "myth": "Hermes, the son of Zeus and the nymph Maia, was born at dawn in a cave on Mount Cyllene and wasted no time causing trouble. By midday he had turned a tortoise shell into the first lyre, and by evening he had snuck off to steal fifty of his brother Apollo's sacred cattle, driving them backward so their hoofprints pointed the wrong way and wearing sandals woven from twigs to hide his own footprints. An old man in a vineyard saw him, but Hermes warned him to keep quiet. He hid the cattle in a cave by the river Alpheus, invented a way to make fire, and roasted two cows, dividing the meat into twelve portions for the gods, before slipping back home through the keyhole like mist and curling up in his cradle. The next morning, Apollo followed the confusing tracks and the old man's tip to Maia's cave, where baby Hermes swore he was too young to even know what a cow was. Apollo dragged him before Zeus, who laughed at the tiny liar and ordered the brothers to make peace. When Hermes played his lyre, Apollo was so enchanted that he traded the cattle for it, gave Hermes a golden staff, and made him god of herds, and the two brothers became lifelong friends.", "cards": [{"t": "Hermes", "d": "Son of Zeus and Maia, who stole Apollo's cattle on the day he was born."}, {"t": "Maia", "d": "A nymph and Hermes's mother, who lived in a cave on Mount Cyllene."}, {"t": "Apollo", "d": "Hermes's older brother, god of music, light, and prophecy, and owner of the stolen cattle."}, {"t": "Mount Cyllene", "d": "The mountain in Arcadia where Hermes was born."}, {"t": "The lyre", "d": "The instrument Hermes invented from a tortoise shell, with seven strings."}, {"t": "The backward trick", "d": "Hermes drove the cattle backward so their hoofprints pointed the wrong way."}, {"t": "The twig sandals", "d": "Sandals Hermes wove from tamarisk and myrtle twigs to hide his own footprints."}, {"t": "The old man in the vineyard", "d": "The only witness to the theft, who later told Apollo what he saw."}, {"t": "The twelve portions", "d": "Hermes roasted two cows and divided the meat into twelve portions for the gods."}, {"t": "The trade", "d": "Hermes gave Apollo the lyre, and in return kept the cattle and became god of herds."}], "quiz": [{"q": "What did Hermes use to make the first lyre?", "o": ["A turtle's shell", "A ram's horn", "A hollow log", "A clay bowl"], "a": 0}, {"q": "How did Hermes hide the cattle's tracks?", "o": ["He carried them across a river", "He drove them backward", "He covered the tracks with sand", "He flew them away"], "a": 1}, {"q": "Who saw Hermes steal the cattle?", "o": ["Zeus", "Maia", "An old man in a vineyard", "A shepherd boy"], "a": 2}, {"q": "How many portions did Hermes divide the roasted meat into?", "o": ["Seven", "Ten", "Twelve", "Fifty"], "a": 2}, {"q": "What excuse did Hermes give Apollo?", "o": ["He was asleep the whole night", "He was just born and didn't know what cattle were", "Zeus told him to take them", "The cattle followed him home"], "a": 1}, {"q": "Who settled the argument between Hermes and Apollo?", "o": ["Athena", "Maia", "Zeus", "Hera"], "a": 2}, {"q": "What did Apollo get in the end?", "o": ["The lyre", "A golden staff", "Half of the cattle", "Hermes's sandals"], "a": 0}, {"q": "Hermes ate the meat he roasted.", "o": ["True", "False"], "a": 1, "why": "He was hungry but didn't eat any of it."}], "id": "hermes", "glyph": "cattle", "hero": "Hermes", "thread": "The lyre", "hint": "Not every string on the cave floor is plain gut. Look closely before you string the lyre.", "order": ["Hermes is born at dawn in a cave on Mount Cyllene", "He makes the first lyre from a tortoise shell", "He drives fifty of Apollo's cattle backward to hide their tracks", "He roasts two cows and divides the meat into twelve portions", "Apollo follows the tracks and the old man's tip to Maia's cave", "Zeus laughs and orders the brothers to make peace", "Apollo trades the cattle for the lyre"]}, {"n": 2, "name": "Argus the Hundred-Eyed", "tier": 1, "tierName": "Initiate", "myth": "Zeus fell in love with Io, a mortal priestess of his wife Hera, and to hide her from Hera's jealousy he turned Io into a beautiful white heifer. Hera wasn't fooled. She asked Zeus for the heifer as a gift, and since refusing would give him away, he had to hand her over. Hera tied Io to an olive tree and set the perfect guard over her: Argus Panoptes, a giant with a hundred eyes covering his body. Only two of his eyes ever closed at a time, so he was always watching. Io, unable to speak, scratched her name in the dirt with her hoof so her father, the river god Inachus, would know what had happened to her. Zeus finally sent Hermes to rescue her. Disguised as a shepherd, Hermes sat beside Argus, played soft music on his reed pipes, and told long stories, including the tale of how Pan's pipes were invented, until every one of Argus's hundred eyes slowly closed. Then Hermes struck the giant down and freed Io, earning the title Argeiphontes, \"slayer of Argus.\" Heartbroken, Hera gathered her loyal guard's hundred eyes and placed them on the tail feathers of her sacred bird, the peacock, where they can still be seen today.", "cards": [{"t": "Argus Panoptes", "d": "A giant with a hundred eyes, set by Hera to guard Io. His name Panoptes means \"all-seeing.\""}, {"t": "Io", "d": "A mortal priestess of Hera whom Zeus loved and turned into a white heifer."}, {"t": "Hera", "d": "Queen of the gods and Zeus's wife, who suspected the heifer was really Io."}, {"t": "Zeus", "d": "King of the gods, who turned Io into a heifer to hide her and later sent Hermes to free her."}, {"t": "Hermes", "d": "The messenger god, sent by Zeus to rescue Io from Argus."}, {"t": "The white heifer", "d": "The young cow Io was transformed into."}, {"t": "Inachus", "d": "Io's father, a river god, who learned what happened when Io wrote her name in the dirt with her hoof."}, {"t": "Two eyes at a time", "d": "Only two of Argus's eyes ever slept at once, so he could always keep watch."}, {"t": "The reed pipes", "d": "The instrument Hermes played, along with long stories, to lull every one of Argus's eyes to sleep."}, {"t": "The peacock", "d": "Hera's sacred bird, which received Argus's hundred eyes on its tail feathers."}], "quiz": [{"q": "How many eyes did Argus have?", "o": ["Two", "Twelve", "Fifty", "One hundred"], "a": 3}, {"q": "What did Zeus turn Io into?", "o": ["A white heifer", "A swan", "A peacock", "A cloud"], "a": 0}, {"q": "Why was Argus such a good guard?", "o": ["He could fly", "He could see through walls", "Only two of his eyes slept at a time", "He never needed food"], "a": 2}, {"q": "How did Io tell her father what happened to her?", "o": ["She sang to him", "She wrote her name in the dirt with her hoof", "She sent a bird with a message", "She appeared in his dream"], "a": 1}, {"q": "How did Hermes get past Argus?", "o": ["He became invisible", "He fought him in a duel", "He tricked Hera into calling Argus away", "He played music and told stories until all his eyes closed"], "a": 3}, {"q": "Who set Argus to guard Io?", "o": ["Zeus", "Hera", "Athena", "Apollo"], "a": 1}, {"q": "Where did Hera place Argus's eyes after he died?", "o": ["In the night sky as stars", "On the wings of a butterfly", "On the peacock's tail feathers", "In the river Inachus"], "a": 2}, {"q": "Zeus refused to give Hera the white heifer.", "o": ["True", "False"], "a": 1, "why": "He handed her over, because refusing would have given away his secret."}], "id": "argus", "glyph": "eye", "hero": "Hermes", "thread": "Io", "hint": "The rope that binds the heifer is not all hemp.", "order": ["Zeus turns Io into a white heifer to hide her", "Hera asks for the heifer as a gift", "Hera sets Argus Panoptes to guard Io", "Io scratches her name in the dirt for her father", "Hermes, disguised as a shepherd, plays his pipes and tells stories", "Every one of Argus's eyes closes and Hermes frees Io", "Hera places Argus's eyes on the peacock's tail"]}, {"n": 3, "name": "Daedalus and the Spiral Shell", "tier": 1, "tierName": "Initiate", "myth": "Daedalus was the greatest inventor in the ancient world. He built the Labyrinth on Crete for King Minos, but after helping the hero Theseus escape it, he was imprisoned there with his son Icarus. Daedalus built wings of feathers and wax for them both, and they flew away, but Icarus flew too close to the sun and fell into the sea. Grieving, Daedalus fled alone to Sicily, where King Cocalus took him in and hid him at his court. Minos was furious and searched the world for him, but he knew Daedalus would never show himself. So Minos came up with a trick. Everywhere he went, he carried a spiral seashell and offered a great reward to anyone who could pass a thread through all of its twisting chambers, knowing only Daedalus was clever enough to solve it. When Minos reached Sicily, Cocalus secretly gave the shell to Daedalus. Daedalus bored a tiny hole at the tip of the shell, put a drop of honey there, tied a thread to an ant, and let the ant crawl in through the opening. Following the scent of the honey, the ant wound its way through every curve and came out the other side, pulling the thread behind it. Cocalus proudly returned the threaded shell, and Minos instantly knew Daedalus was hiding there. He demanded that Cocalus hand him over, but Cocalus's daughters, who adored Daedalus and his clever inventions, made sure Minos never left Sicily, and Daedalus remained safe.", "cards": [{"t": "Daedalus", "d": "The greatest inventor of ancient Greece, who built the Labyrinth and the wings for himself and Icarus."}, {"t": "Icarus", "d": "Daedalus's son, who flew too close to the sun and fell into the sea."}, {"t": "King Minos", "d": "The king of Crete, who hunted Daedalus across the world."}, {"t": "The Labyrinth", "d": "The maze Daedalus built on Crete for King Minos."}, {"t": "King Cocalus", "d": "The king of Sicily, who welcomed Daedalus and hid him at his court."}, {"t": "The spiral shell", "d": "The puzzle Minos carried, offering a reward to anyone who could pass a thread through it."}, {"t": "The ant", "d": "The creature Daedalus tied the thread to, so it could crawl through the shell."}, {"t": "The honey", "d": "The bait Daedalus placed at the shell's tip to lead the ant through the spiral."}, {"t": "Minos's trick", "d": "Minos knew only Daedalus could solve the shell, so whoever solved it would reveal where he was hiding."}, {"t": "Cocalus's daughters", "d": "They loved Daedalus's inventions and made sure Minos never left Sicily."}], "quiz": [{"q": "What did Minos carry with him while searching for Daedalus?", "o": ["A golden crown", "A spiral seashell", "A map of the Labyrinth", "A feather from Icarus's wings"], "a": 1}, {"q": "Where was Daedalus hiding?", "o": ["Athens", "Egypt", "Sicily", "Crete"], "a": 2}, {"q": "What did Daedalus tie the thread to?", "o": ["A bee", "A mouse", "A spider", "An ant"], "a": 3}, {"q": "What did Daedalus use to lead the ant through the shell?", "o": ["A drop of honey", "A light", "A piece of bread", "A tiny whistle"], "a": 0}, {"q": "Why did Minos want someone to solve the shell puzzle?", "o": ["He wanted to give away his treasure", "He needed a new inventor for his palace", "He knew only Daedalus could solve it, so it would reveal where he was hiding", "He had lost the thread inside it"], "a": 2}, {"q": "Who hid Daedalus and gave him the shell in secret?", "o": ["King Cocalus", "Theseus", "Icarus", "Ariadne"], "a": 0}, {"q": "What famous structure did Daedalus build for Minos on Crete?", "o": ["The Parthenon", "The Labyrinth", "The Colossus", "A great lighthouse"], "a": 1}, {"q": "Minos captured Daedalus and brought him back to Crete.", "o": ["True", "False"], "a": 1, "why": "Minos never left Sicily, and Daedalus remained safe."}], "id": "daedalus", "glyph": "spiral", "hero": "Daedalus", "thread": "The ant", "hint": "Before the ant goes in, choose its thread carefully. One spool is brighter than the rest.", "order": ["Daedalus builds the Labyrinth for King Minos", "Daedalus and Icarus escape Crete on wings of feathers and wax", "Cocalus hides Daedalus at his court in Sicily", "Minos travels the world with a spiral shell puzzle", "Daedalus ties a thread to an ant and lures it with honey", "Cocalus returns the threaded shell and Minos knows Daedalus is there", "Cocalus's daughters make sure Minos never leaves Sicily"]}, {"n": 4, "name": "Philemon and Baucis", "tier": 2, "tierName": "Adept", "myth": "Zeus and Hermes once disguised themselves as tired, poor travelers and wandered through the land of Phrygia, knocking on a thousand doors to ask for food and shelter. Every door was slammed in their faces until they reached a tiny cottage with a roof of reeds and straw, the home of an old couple named Philemon and Baucis. They were very poor, but they welcomed the strangers in without a second thought. Baucis blew the dying fire back to life, Philemon brought in vegetables from the garden, and they set a humble feast on a wobbly table that Baucis steadied by propping a broken piece of pottery under one leg. They served everything they had: olives, cherries, radishes, cheese, eggs roasted in the ashes, and a simple bowl of wine. As the meal went on, the couple noticed something strange. No matter how much wine they poured, the bowl kept filling itself back up. Realizing their guests were gods, they were frightened and tried to catch their only goose to cook a proper meal, but the goose ran straight to the gods for protection, and Zeus stopped them. The gods revealed themselves and led the couple up a nearby mountain. Looking back, Philemon and Baucis saw the whole valley flooded as punishment for their cruel neighbors, while their little cottage had transformed into a magnificent temple with marble columns and a golden roof. Zeus offered them any wish, and they asked to care for the temple for the rest of their lives and to die at the same moment, so neither would ever have to live without the other. Their wish was granted. When they grew very old, they turned into two trees, an oak and a linden, growing side by side with their branches intertwined forever.", "cards": [{"t": "Philemon", "d": "An old, poor man who welcomed two strangers into his home when no one else would."}, {"t": "Baucis", "d": "Philemon's wife, who prepared the feast and served the disguised gods with kindness."}, {"t": "Zeus and Hermes", "d": "The two gods who disguised themselves as poor travelers to test how people treated strangers."}, {"t": "Phrygia", "d": "The land where the gods wandered and Philemon and Baucis lived."}, {"t": "Xenia", "d": "The ancient Greek rule of hospitality, which said guests and strangers must be welcomed and cared for. Zeus was its protector."}, {"t": "The thousand doors", "d": "Every home that turned the disguised gods away before they reached the cottage."}, {"t": "The endless wine bowl", "d": "The bowl that kept refilling itself, revealing that the guests were gods."}, {"t": "The goose", "d": "The couple's only goose, which ran to the gods for protection when the couple tried to cook it."}, {"t": "The temple", "d": "The couple's cottage transformed into a temple with marble columns and a golden roof, while the valley flooded."}, {"t": "The oak and the linden", "d": "The two trees Philemon and Baucis became, growing side by side forever."}], "quiz": [{"q": "Why did Zeus and Hermes disguise themselves as poor travelers?", "o": ["To hide from Hera", "To test how people treated strangers", "To find a lost goose", "To search for a new temple"], "a": 1}, {"q": "How many doors did the gods knock on before reaching the cottage?", "o": ["Ten", "Twelve", "One hundred", "A thousand"], "a": 3}, {"q": "What strange thing showed the couple that their guests were gods?", "o": ["The guests glowed in the dark", "The fire changed colors", "The wine bowl kept refilling itself", "The table began to float"], "a": 2}, {"q": "What did Baucis use to fix the wobbly table?", "o": ["A folded cloth", "A broken piece of pottery", "A small stone", "A stack of leaves"], "a": 1}, {"q": "What happened when the couple tried to cook their goose?", "o": ["The goose flew away to Mount Olympus", "The goose turned into a swan", "The goose ran to the gods for protection, and Zeus stopped them", "The goose laid a golden egg"], "a": 2}, {"q": "What happened to the couple's cottage?", "o": ["It burned down", "It turned into a temple with a golden roof", "It was swept away by the flood", "It became invisible"], "a": 1}, {"q": "What did Philemon and Baucis turn into at the end of their lives?", "o": ["Two stars", "Two birds", "Two stones", "Two trees, an oak and a linden"], "a": 3}, {"q": "Philemon and Baucis were wealthy and had plenty of food to share.", "o": ["True", "False"], "a": 1, "why": "They were very poor but shared everything they had."}], "id": "baucis", "glyph": "trees", "hero": "Baucis", "thread": "The thousand doors", "hint": "An old spinner keeps her spindle by the hearth. Its last thread is worth a few seconds.", "order": ["Zeus and Hermes knock on a thousand doors in Phrygia", "Philemon and Baucis welcome the strangers in", "Baucis props the wobbly table with a broken piece of pottery", "The wine bowl keeps refilling itself", "The goose runs to the gods for protection", "The valley floods and the cottage becomes a temple", "The couple become an oak and a linden"]}, {"n": 5, "name": "Phaethon", "tier": 2, "tierName": "Adept", "myth": "Phaethon was the son of Clymene and Helios, the god who drove the sun across the sky. When his friend Epaphus, a son of Zeus, mocked him and said his mother had lied about who his father was, Phaethon traveled east to the dazzling Palace of the Sun to find out the truth. Helios welcomed him, set aside his blinding crown of rays, and to prove he was his father, swore an unbreakable oath on the river Styx to grant Phaethon anything he wished. Phaethon asked to drive the sun chariot across the sky for one day. Helios begged him to choose anything else. Even Zeus couldn't control those horses, and the path was terrifying, rising steeply at dawn, soaring dizzyingly high at noon, and plunging down at evening, past constellations shaped like wild beasts. But an oath on the Styx could not be broken. Helios gave his son one last piece of advice: hold the reins tight, never use the whip, and stay on the middle path, not too high and not too low. As soon as the four fiery horses felt how light the chariot was without their master, they bolted off course. Terrified by the giant Scorpion in the stars, Phaethon dropped the reins. The chariot swooped too high and scorched the heavens, then dove too low and set the earth on fire, drying up rivers and burning forests and mountains. Earth cried out to Zeus for help, and Zeus struck Phaethon from the chariot with a thunderbolt. He fell like a shooting star into the river Eridanus. His sisters, the Heliades, wept for him so long on the riverbank that they turned into poplar trees, and their tears hardened into amber.", "cards": [{"t": "Phaethon", "d": "The son of Helios, who begged to drive the sun chariot for one day."}, {"t": "Helios", "d": "The god who drove the sun across the sky each day in a golden chariot."}, {"t": "Clymene", "d": "Phaethon's mother, who told him Helios was his father."}, {"t": "Epaphus", "d": "A son of Zeus and Io who mocked Phaethon and made him doubt who his father was."}, {"t": "The oath on the Styx", "d": "An unbreakable promise sworn by the gods. Helios swore it and had to grant Phaethon's wish."}, {"t": "The sun chariot", "d": "A blazing golden chariot pulled by four fiery horses that even Zeus couldn't control."}, {"t": "The middle path", "d": "Helios's advice to stay not too high and not too low, so neither the sky nor the earth would burn."}, {"t": "The Scorpion", "d": "The giant constellation that terrified Phaethon and made him drop the reins."}, {"t": "Zeus's thunderbolt", "d": "Zeus struck Phaethon from the chariot to save the earth, and he fell into the river Eridanus."}, {"t": "The Heliades", "d": "Phaethon's sisters, who turned into poplar trees from grief while their tears became amber."}], "quiz": [{"q": "Who was Phaethon's father?", "o": ["Zeus", "Apollo", "Helios", "Poseidon"], "a": 2}, {"q": "Why did Phaethon travel to the Palace of the Sun?", "o": ["To steal the sun chariot", "To prove that Helios was really his father", "To ask for a crown of rays", "To find his lost sisters"], "a": 1}, {"q": "Why couldn't Helios refuse Phaethon's wish?", "o": ["Zeus ordered him to agree", "Phaethon tricked him", "He swore an unbreakable oath on the river Styx", "He thought Phaethon was ready"], "a": 2}, {"q": "What was Helios's advice?", "o": ["Fly as high as possible", "Use the whip to go faster", "Close your eyes and trust the horses", "Stay on the middle path, not too high and not too low"], "a": 3}, {"q": "What frightened Phaethon into dropping the reins?", "o": ["A thunderstorm", "The giant Scorpion constellation", "A flock of birds", "His father's voice"], "a": 1}, {"q": "What happened when the chariot flew too low?", "o": ["The oceans froze", "Night came early", "The earth caught fire and rivers dried up", "The horses fell asleep"], "a": 2}, {"q": "What did Phaethon's sisters' tears turn into?", "o": ["Pearls", "Amber", "Rain", "Stars"], "a": 1}, {"q": "Helios was happy to let Phaethon drive the sun chariot.", "o": ["True", "False"], "a": 1, "why": "He begged Phaethon to choose any other wish."}], "id": "phaethon", "glyph": "sun", "hero": "Phaethon", "thread": "The Heliades", "hint": "When the sisters weep, watch their tears. One drop holds more than amber.", "order": ["Epaphus mocks Phaethon about his father", "Phaethon travels east to the Palace of the Sun", "Helios swears an oath on the river Styx", "Helios warns him to stay on the middle path", "The Scorpion frightens Phaethon into dropping the reins", "Zeus strikes Phaethon down with a thunderbolt", "The Heliades become poplars and their tears become amber"]}, {"n": 6, "name": "Psyche's Trials", "tier": 2, "tierName": "Adept", "myth": "Psyche was a mortal princess so beautiful that people stopped worshipping Aphrodite and began worshipping her instead. Furious, Aphrodite sent her son Eros, the god of love, to make Psyche fall in love with a monster, but when Eros saw her, he fell in love with her himself. Psyche was carried by the west wind to a hidden palace, where Eros became her husband but visited only in the dark and made her promise never to look at his face. Psyche’s jealous sisters convinced her that her husband was secretly a monster, so one night she lit an oil lamp to see him while he slept. To her amazement, she saw the beautiful god of love, but a drop of hot oil fell on his shoulder, and he woke up and flew away, heartbroken that she had broken her promise. Desperate to win him back, Psyche went to Aphrodite, who gave her a series of impossible tasks. First, she had to sort a mountain of mixed grains and seeds in one night, and an army of ants took pity on her and sorted them all. Next, she had to gather wool from a flock of dangerous golden sheep, and a whispering river reed told her to wait until afternoon, when the sheep rested, and collect the wool snagged on the thorn bushes. Then she was sent to fill a jar with water from the source of the river Styx, high on a cliff guarded by dragons, and Zeus’s eagle flew down and filled it for her. Her final task was to travel into the Underworld and bring back a box of beauty from Persephone. She carried two coins for the ferryman Charon and two barley cakes for the three-headed dog Cerberus, and made it back safely, but curiosity got the better of her and she opened the box. Instead of beauty, it held a deathlike sleep, and she collapsed. Eros, who had never stopped loving her, found her, wiped the sleep away, and begged Zeus to let them be together. Zeus gave Psyche ambrosia, the food of the gods, to make her immortal, and she and Eros were married on Mount Olympus. Her name means “soul,” and she is often shown with butterfly wings.", "cards": [{"t": "Psyche", "d": "A mortal princess whose beauty made Aphrodite jealous. Her name means “soul.”"}, {"t": "Eros", "d": "The god of love and Aphrodite’s son, who fell in love with Psyche and became her husband."}, {"t": "Aphrodite", "d": "The goddess of love and beauty, who gave Psyche impossible tasks."}, {"t": "The oil lamp", "d": "Psyche lit it to see her husband’s face, and a drop of hot oil woke him."}, {"t": "The ants", "d": "They took pity on Psyche and sorted the mountain of mixed seeds for her."}, {"t": "The golden sheep", "d": "Dangerous sheep whose wool Psyche gathered from thorn bushes, following a river reed’s advice."}, {"t": "The water of the Styx", "d": "Water from a cliff guarded by dragons, fetched for Psyche by Zeus’s eagle."}, {"t": "Persephone’s box", "d": "A box Psyche brought back from the Underworld. When she opened it, it held a deathlike sleep."}, {"t": "The coins and barley cakes", "d": "Two coins for the ferryman Charon and two barley cakes for Cerberus, one of each for the journey there and back."}, {"t": "Ambrosia", "d": "The food of the gods, which Zeus gave Psyche to make her immortal."}], "quiz": [{"q": "Why was Aphrodite angry with Psyche?", "o": ["Psyche stole her jewelry", "People began worshipping Psyche instead of her", "Psyche insulted Zeus", "Psyche refused to visit her temple"], "a": 1}, {"q": "What was Psyche never supposed to do?", "o": ["Leave the palace", "Speak to her sisters", "Look at her husband’s face", "Light a fire"], "a": 2}, {"q": "Who helped Psyche sort the mountain of seeds?", "o": ["Birds", "Ants", "Bees", "Her sisters"], "a": 1}, {"q": "How did Psyche safely gather the golden wool?", "o": ["She sheared the sheep while they slept at night", "She tamed the sheep with music", "She collected wool caught on thorn bushes while the sheep rested", "She asked Eros to fetch it"], "a": 2}, {"q": "Who filled the jar with water from the Styx?", "o": ["Hermes", "Zeus’s eagle", "A river nymph", "Eros"], "a": 1}, {"q": "What did Psyche bring to get past Charon and Cerberus?", "o": ["A sword and a shield", "A lyre and a song", "Two coins and two barley cakes", "A golden apple"], "a": 2}, {"q": "What was inside Persephone’s box?", "o": ["Jewels", "A deathlike sleep", "A butterfly", "Nothing at all"], "a": 1}, {"q": "Psyche stayed mortal for the rest of her life.", "o": ["True", "False"], "a": 1, "why": "Zeus gave her ambrosia and made her immortal."}], "id": "psyche", "glyph": "butterfly", "hero": "Psyche", "thread": "The golden sheep", "hint": "Among the golden wool, one strand was spun, not grown.", "order": ["Aphrodite sends Eros to make Psyche love a monster", "Psyche lights the oil lamp and Eros flies away", "The ants sort the mountain of seeds", "Psyche gathers golden wool from the thorn bushes", "Zeus's eagle fills the jar with water from the Styx", "Psyche opens Persephone's box and falls into a deathlike sleep", "Zeus gives Psyche ambrosia and she marries Eros"]}, {"n": 7, "name": "Sisyphus Cheats Death", "tier": 3, "tierName": "Master", "myth": "Sisyphus was the king of Corinth and the cleverest, most cunning man of his time. One day he saw Zeus carry off Aegina, the daughter of the river god Asopus. When Asopus came searching for her, Sisyphus made a deal: he would reveal who took her if Asopus gave Corinth a spring of fresh water. Asopus agreed, and a spring burst from the rock of the city’s citadel. Zeus was furious that Sisyphus had told his secret, so he sent Thanatos, the god of Death, to chain Sisyphus and drag him to the Underworld. Sisyphus greeted Death politely and asked him to show how the chains worked. When Thanatos demonstrated, Sisyphus snapped the chains shut on Death himself. With Death locked away, no one on earth could die. Sick people stayed sick but lived on, and warriors fought battles where nobody fell. Ares, the god of war, was outraged that his battles had become pointless, so he stormed into Corinth, freed Thanatos, and handed Sisyphus over to him. But Sisyphus had one more trick. Before he died, he told his wife, Merope, not to give him a proper funeral or offerings. In the Underworld, he complained to Persephone that his wife had disrespected him and begged to return to the world for just one day to scold her. Persephone allowed it, but once he was back in the sunlight, Sisyphus refused to return and lived on until he was very old. When he finally died for good, Hermes dragged him back to the Underworld, and the gods gave him a punishment to match his tricks: he had to roll a huge boulder up a steep hill forever, but every time he neared the top, it slipped from his hands and rolled back down.", "cards": [{"t": "Sisyphus", "d": "The cunning king of Corinth, who tricked Death and escaped the Underworld."}, {"t": "Corinth", "d": "The Greek city Sisyphus ruled."}, {"t": "Asopus", "d": "A river god who gave Corinth a spring in exchange for learning who took his daughter."}, {"t": "Aegina", "d": "Asopus’s daughter, carried off by Zeus."}, {"t": "Thanatos", "d": "The god of Death, sent by Zeus to take Sisyphus to the Underworld."}, {"t": "The chains", "d": "Sisyphus asked Death to show how the chains worked, then locked Death in them."}, {"t": "Ares", "d": "The god of war, who freed Death because no one could die in his battles."}, {"t": "Merope", "d": "Sisyphus’s wife, whom he told not to give him a proper funeral."}, {"t": "Persephone", "d": "Queen of the Underworld, who let Sisyphus return to the world for one day."}, {"t": "The boulder", "d": "Sisyphus’s punishment: rolling a boulder up a hill forever, only for it to roll back down."}], "quiz": [{"q": "What did Sisyphus get in exchange for revealing Zeus’s secret?", "o": ["A golden crown", "A spring of fresh water for Corinth", "A magic sword", "A ship"], "a": 1}, {"q": "Who did Zeus send to take Sisyphus to the Underworld?", "o": ["Hermes", "Hades", "Thanatos", "Ares"], "a": 2}, {"q": "How did Sisyphus trap Death?", "o": ["He locked him in a cave", "He asked Death to show how the chains worked, then locked him in them", "He made him fall asleep with music", "He tricked him into drinking a potion"], "a": 1}, {"q": "What happened while Death was chained?", "o": ["The sun stopped rising", "The rivers dried up", "No one on earth could die", "The gods lost their powers"], "a": 2}, {"q": "Which god freed Death?", "o": ["Zeus", "Apollo", "Ares", "Poseidon"], "a": 2}, {"q": "What did Sisyphus tell his wife to do before he died?", "o": ["Hide his treasure", "Leave Corinth", "Not give him a proper funeral", "Build him a temple"], "a": 2}, {"q": "How did Sisyphus escape the Underworld?", "o": ["He fought Cerberus", "He swam across the river Styx", "He convinced Persephone to let him return for one day, then never went back", "He disguised himself as Hermes"], "a": 2}, {"q": "Sisyphus’s boulder finally reached the top of the hill.", "o": ["True", "False"], "a": 1, "why": "It always rolls back down just before the top."}], "id": "sisyphus", "glyph": "boulder", "hero": "Sisyphus", "thread": "Thanatos", "hint": "Death carries a small pouch at his belt. What is inside should have been cut long ago.", "order": ["Sisyphus trades Zeus's secret for a spring in Corinth", "Zeus sends Thanatos to take Sisyphus", "Sisyphus locks Death in his own chains", "Ares frees Death because no one can die in battle", "Sisyphus tells Merope not to give him a funeral", "Persephone lets him return for one day and he never goes back", "Sisyphus is sentenced to roll his boulder forever"]}, {"n": 8, "name": "Bellerophon and Pegasus", "tier": 3, "tierName": "Master", "myth": "Bellerophon was a young prince of Corinth and the grandson of Sisyphus. More than anything, he wanted to ride Pegasus, the wild winged horse that sprang from Medusa’s neck when the hero Perseus defeated her. No one had ever tamed him. The seer Polyidus told Bellerophon to spend the night sleeping at the altar of Athena. In a dream, the goddess appeared and handed him a golden bridle, and when he woke up, it was really in his hand. He found Pegasus drinking at the spring of Peirene, slipped the bridle over his head, and the wild horse let him climb on. Later, Bellerophon was falsely accused of a crime at the court of King Proetus. Proetus didn’t dare harm a guest himself, so he sent Bellerophon to King Iobates of Lycia with a sealed letter. Bellerophon didn’t know the letter asked Iobates to have him killed. Iobates sent him on what seemed like a hopeless task: to slay the Chimera, a fire-breathing monster with the head of a lion, the body of a goat, and a serpent for a tail. Bellerophon flew above it on Pegasus, out of reach of its flames, and shot it with arrows. Then he fixed a lump of lead to the tip of his spear and thrust it into the monster’s mouth. The Chimera’s own fiery breath melted the lead, which poured down its throat and killed it. Bellerophon survived every other deadly task Iobates gave him too, until the king finally realized he was favored by the gods, gave him his daughter in marriage, and shared his kingdom with him. But success made Bellerophon proud. He decided he deserved to live among the gods and flew Pegasus toward Mount Olympus. Zeus sent a gadfly to sting Pegasus, and the horse bucked, throwing Bellerophon back down to earth. He spent the rest of his life wandering alone, while Pegasus flew on to Olympus and carried Zeus’s thunderbolts.", "cards": [{"t": "Bellerophon", "d": "A hero from Corinth and Sisyphus’s grandson, who tamed Pegasus and defeated the Chimera."}, {"t": "Pegasus", "d": "A wild winged horse that sprang from Medusa when Perseus defeated her."}, {"t": "Polyidus", "d": "The seer who told Bellerophon to sleep at Athena’s altar. (He returns in Panel 11.)"}, {"t": "Athena", "d": "The goddess of wisdom, who gave Bellerophon a golden bridle in a dream."}, {"t": "The golden bridle", "d": "The magical bridle that let Bellerophon tame Pegasus."}, {"t": "The spring of Peirene", "d": "The spring in Corinth where Bellerophon found Pegasus drinking."}, {"t": "The sealed letter", "d": "A letter from King Proetus to King Iobates secretly asking him to kill Bellerophon."}, {"t": "The Chimera", "d": "A fire-breathing monster with a lion’s head, a goat’s body, and a serpent for a tail."}, {"t": "The lead-tipped spear", "d": "Bellerophon pushed it into the Chimera’s mouth, and the monster’s fire melted the lead and killed it."}, {"t": "The gadfly", "d": "The insect Zeus sent to sting Pegasus when Bellerophon tried to fly to Mount Olympus."}], "quiz": [{"q": "How did Bellerophon get the golden bridle?", "o": ["He bought it at a market", "He won it in a race", "Athena gave it to him in a dream", "Pegasus brought it to him"], "a": 2}, {"q": "Where did Bellerophon find Pegasus?", "o": ["On top of Mount Olympus", "Drinking at the spring of Peirene", "In a cave by the sea", "In Athena’s temple"], "a": 1}, {"q": "What did the sealed letter secretly say?", "o": ["That Bellerophon should be made king", "That Iobates should have Bellerophon killed", "Where to find the Chimera", "How to tame Pegasus"], "a": 1}, {"q": "Which of these was NOT part of the Chimera?", "o": ["A lion’s head", "A goat’s body", "A serpent’s tail", "An eagle’s wings"], "a": 3}, {"q": "How did Bellerophon finally kill the Chimera?", "o": ["He trapped it in a cave", "He cut off all three of its heads", "He pushed a lead-tipped spear into its mouth, and its fire melted the lead", "Pegasus kicked it off a cliff"], "a": 2}, {"q": "Why did Bellerophon fly toward Mount Olympus?", "o": ["To return the golden bridle", "To warn Zeus about a monster", "He became proud and thought he belonged among the gods", "Athena invited him"], "a": 2}, {"q": "What did Zeus send to stop him?", "o": ["A thunderbolt", "A storm", "An eagle", "A gadfly"], "a": 3}, {"q": "Pegasus stayed on earth with Bellerophon after he fell.", "o": ["True", "False"], "a": 1, "why": "Pegasus flew on to Olympus and carried Zeus’s thunderbolts."}], "id": "bellerophon", "glyph": "wing", "hero": "Bellerophon", "thread": "The sealed letter", "hint": "The cord around the letter has one strand that shines. Pull it slowly.", "order": ["Bellerophon sleeps at Athena's altar", "Athena gives him a golden bridle in a dream", "He bridles Pegasus at the spring of Peirene", "Proetus sends him to Iobates with a sealed letter", "He kills the Chimera with a lead-tipped spear", "He flies toward Mount Olympus out of pride", "Zeus's gadfly stings Pegasus and Bellerophon falls"]}, {"n": 9, "name": "Cadmus and the Dragon's Teeth", "tier": 3, "tierName": "Master", "myth": "Cadmus was a prince of Phoenicia, the son of King Agenor. When Zeus, disguised as a white bull, carried off Cadmus’s sister Europa, Agenor sent his sons to find her and told them not to come home without her. Cadmus searched for a long time without any luck, so he traveled to the Oracle at Delphi for help. The Oracle told him to stop looking for his sister. Instead, he should follow a cow with a half-moon mark on her side and build a city wherever she lay down to rest. Cadmus found the cow and followed her across the land until she finally lay down in a place called Boeotia, where he decided to found his city, Thebes. Wanting to sacrifice the cow to Athena, he sent his companions to fetch water from a nearby spring. But the spring belonged to Ares, the god of war, and it was guarded by a huge dragon that attacked them, and they never returned. Cadmus went after them and killed the dragon. Then Athena appeared and told him to plant the dragon’s teeth in the ground. As soon as he did, fully armed warriors burst out of the earth. Cadmus threw a stone into the middle of them, and each warrior thought another had thrown it. They turned on each other and fought until only five were left standing. Those five, called the Spartoi, or “sown men,” helped Cadmus build Thebes, and their families became its noble houses. Because he had killed Ares’s dragon, Cadmus had to serve the war god for eight years, but afterward he married Harmonia, the daughter of Ares and Aphrodite, and all the gods came to their wedding. Cadmus is also said to have brought the alphabet to Greece from Phoenicia.", "cards": [{"t": "Cadmus", "d": "A Phoenician prince who founded the city of Thebes."}, {"t": "Europa", "d": "Cadmus’s sister, carried off by Zeus disguised as a white bull."}, {"t": "King Agenor", "d": "Cadmus’s father, who sent his sons to find Europa."}, {"t": "The Oracle at Delphi", "d": "Told Cadmus to stop searching for Europa and follow a cow instead."}, {"t": "The cow with the half-moon mark", "d": "The cow Cadmus followed. Where she lay down, he built Thebes."}, {"t": "Thebes", "d": "The city Cadmus founded in the land of Boeotia."}, {"t": "The dragon of Ares", "d": "A huge dragon guarding a spring sacred to Ares, which Cadmus killed."}, {"t": "The Spartoi", "d": "The “sown men,” armed warriors who grew from the dragon’s teeth. Five survived and helped build Thebes."}, {"t": "Harmonia", "d": "The daughter of Ares and Aphrodite, who married Cadmus."}, {"t": "The alphabet", "d": "Cadmus is said to have brought the alphabet to Greece from Phoenicia."}], "quiz": [{"q": "Why did Cadmus leave home?", "o": ["To become king of another land", "To find his sister Europa", "To hunt a dragon", "To visit Mount Olympus"], "a": 1}, {"q": "Where did Cadmus go for advice?", "o": ["To Athena’s temple in Athens", "To the river Styx", "To the Oracle at Delphi", "To King Minos"], "a": 2}, {"q": "What was Cadmus told to follow?", "o": ["A golden eagle", "A cow with a half-moon mark", "A shooting star", "A river to the sea"], "a": 1}, {"q": "Who guarded the spring near Thebes?", "o": ["A giant with a hundred eyes", "A dragon sacred to Ares", "A sphinx", "A three-headed dog"], "a": 1}, {"q": "What did Athena tell Cadmus to do with the dragon’s teeth?", "o": ["Plant them in the ground", "Throw them into the sea", "Make them into a necklace", "Give them to Ares"], "a": 0}, {"q": "How did Cadmus get the warriors to fight each other?", "o": ["He played music", "He threw a stone among them", "He told each of them a different lie", "He set a fire between them"], "a": 1}, {"q": "How many warriors were left standing?", "o": ["One", "Three", "Five", "Twelve"], "a": 2}, {"q": "Cadmus is said to have brought the alphabet to Greece.", "o": ["True", "False"], "a": 0, "why": "He brought it from Phoenicia."}], "id": "cadmus", "glyph": "tooth", "hero": "Cadmus", "thread": "The Oracle at Delphi", "hint": "When the Oracle speaks, look at the hem of her veil, even if it costs you a word.", "order": ["Zeus carries off Europa", "Cadmus asks the Oracle at Delphi for help", "He follows a cow with a half-moon mark", "The cow lies down and Cadmus founds Thebes", "Cadmus kills the dragon of Ares", "He plants the dragon's teeth and armed men rise", "Five Spartoi survive and help build Thebes"]}, {"n": 10, "name": "Arion and the Dolphin", "tier": 4, "tierName": "Oracle", "myth": "Arion of Lesbos was the most famous musician of his time, a singer and lyre player who lived at the court of Periander, the ruler of Corinth. He traveled to Italy and Sicily, where he won great riches in music contests, and when it was time to go home, he hired a ship from Corinth because he trusted its sailors more than any others. But once they were out at sea, the sailors plotted to throw him overboard and keep his treasure. They told him he could either take his own life and be buried on land, or jump into the sea. Arion asked for one last favor: to put on his full singer’s robes and sing one final song. The sailors agreed, curious to hear the greatest singer in the world. Standing at the back of the ship, Arion sang a song to Apollo, then leaped into the waves. A dolphin, drawn by his music, swam beneath him and carried him safely on its back all the way to Cape Taenarum in southern Greece. From there, Arion traveled to Corinth and told Periander what had happened, but Periander didn’t believe him and kept him under guard. When the ship arrived, Periander asked the sailors where Arion was, and they claimed he was safe and well in Italy. At that moment, Arion stepped out wearing the same robes he had worn when he jumped, and the sailors were caught in their lie. A bronze statue of a man riding a dolphin was set up at Taenarum, and later stories say Apollo placed the dolphin and Arion’s lyre among the stars as the constellations Delphinus and Lyra.", "cards": [{"t": "Arion", "d": "A famous singer and lyre player from the island of Lesbos."}, {"t": "Periander", "d": "The ruler of Corinth, at whose court Arion lived."}, {"t": "Italy and Sicily", "d": "Where Arion won great riches in music contests."}, {"t": "The sailors", "d": "The crew from Corinth who plotted to throw Arion overboard and steal his treasure."}, {"t": "The last song", "d": "Arion asked to sing one final song in his singer’s robes before leaping into the sea."}, {"t": "Apollo", "d": "The god of music, to whom Arion sang his final song."}, {"t": "The dolphin", "d": "Drawn by Arion’s music, it carried him safely to shore on its back."}, {"t": "Cape Taenarum", "d": "The point in southern Greece where the dolphin brought Arion ashore."}, {"t": "The robes", "d": "Arion wore the same robes when he confronted the sailors, proving their story was a lie."}, {"t": "Delphinus and Lyra", "d": "The constellations of the dolphin and the lyre, said to be placed in the stars by Apollo."}], "quiz": [{"q": "What was Arion famous for?", "o": ["Building ships", "Singing and playing the lyre", "Taming wild animals", "Fighting monsters"], "a": 1}, {"q": "How did Arion become rich?", "o": ["He found buried treasure", "He won music contests in Italy and Sicily", "Periander gave him a palace", "He sold his lyre"], "a": 1}, {"q": "What did the sailors plan to do?", "o": ["Take Arion to a different island", "Make him their captain", "Throw him overboard and steal his treasure", "Sell his lyre in Corinth"], "a": 2}, {"q": "What was Arion’s last request?", "o": ["A meal", "A boat to row away in", "To sing one final song in his singer’s robes", "To write a letter to Periander"], "a": 2}, {"q": "What saved Arion after he jumped into the sea?", "o": ["A sea nymph", "Poseidon’s chariot", "A piece of floating wood", "A dolphin drawn by his music"], "a": 3}, {"q": "Where did the dolphin bring Arion?", "o": ["Cape Taenarum", "Delphi", "The island of Lesbos", "Mount Olympus"], "a": 0}, {"q": "How did Arion prove the sailors were lying?", "o": ["He showed Periander a letter", "He brought the dolphin to Corinth", "He appeared in the same robes he wore when he jumped", "One sailor confessed"], "a": 2}, {"q": "The sailors told Periander that Arion had drowned at sea.", "o": ["True", "False"], "a": 1, "why": "They claimed he was safe and well in Italy."}], "id": "arion", "glyph": "dolphin", "hero": "Arion", "thread": "The dolphin", "hint": "Something is tangled around the dolphin's fin. Loosen your grip to free it.", "order": ["Arion wins riches in music contests in Italy and Sicily", "He hires a ship from Corinth to sail home", "The sailors plot to throw him overboard", "Arion sings one last song to Apollo in his robes", "A dolphin carries him to Cape Taenarum", "The sailors claim Arion is safe in Italy", "Arion steps out in his robes and exposes their lie"]}, {"n": 11, "name": "Polyidus the Seer", "tier": 4, "tierName": "Oracle", "myth": "Glaucus, the young son of King Minos of Crete, was playing in the palace when he chased a mouse into a storeroom, tumbled into a huge jar of honey, and disappeared. Minos searched everywhere without finding him, so he asked an oracle for help. The oracle told him that a strange calf in his herds changed color three times a day, from white to red to black, and that whoever could best describe what the calf was like would find the boy and bring him back. Minos gathered all the seers of the land, and only Polyidus of Argos had the answer: the calf was like a mulberry, which starts white, turns red, and ripens to black. Minos sent him to find Glaucus. Polyidus watched for signs and saw an owl perched above a storeroom door, chasing away a swarm of bees. Inside, he found the boy in the jar of honey, but it was too late, and Glaucus had died. Minos refused to accept it. He declared that Polyidus must bring his son back to life and sealed him inside the tomb with the boy’s body. In the darkness, a snake slithered toward the body, and Polyidus struck it with a stone. Soon a second snake appeared, saw its companion lying still, and slipped away. It came back carrying a small herb, laid it on the first snake, and the snake came back to life. Polyidus took the same herb, placed it on Glaucus, and the boy opened his eyes. Minos was overjoyed, but he still wouldn’t let Polyidus go home until he taught Glaucus the art of prophecy. Polyidus did as he was told, but as he boarded his ship to leave, he asked Glaucus to spit into his mouth. The moment Glaucus did, he forgot everything he had learned.", "cards": [{"t": "Polyidus", "d": "A seer from Argos who found and saved Minos’s son. (He also advised Bellerophon in Panel 8.)"}, {"t": "Glaucus", "d": "The young son of King Minos, who fell into a jar of honey."}, {"t": "King Minos", "d": "The king of Crete, who demanded that Polyidus bring his son back to life. (The same Minos from Panel 3.)"}, {"t": "The three-colored calf", "d": "A calf in Minos’s herds that changed from white to red to black."}, {"t": "The mulberry", "d": "Polyidus’s answer to the riddle, a fruit that turns from white to red to black as it ripens."}, {"t": "The owl and the bees", "d": "The sign that showed Polyidus where Glaucus was hidden."}, {"t": "The jar of honey", "d": "Where Glaucus was found."}, {"t": "The tomb", "d": "Minos sealed Polyidus inside it with Glaucus and ordered him to bring the boy back to life."}, {"t": "The healing herb", "d": "The herb a snake used to revive its companion, which Polyidus used on Glaucus."}, {"t": "The forgetting", "d": "Glaucus spat into Polyidus’s mouth and forgot all the prophecy he had learned."}], "quiz": [{"q": "How did Glaucus go missing?", "o": ["He ran away to sea", "He fell into a jar of honey", "He got lost in the Labyrinth", "He was carried off by an eagle"], "a": 1}, {"q": "What colors did the strange calf turn?", "o": ["Gold, silver, and bronze", "Blue, green, and gray", "White, red, and black", "Brown, white, and spotted"], "a": 2}, {"q": "What did Polyidus compare the calf to?", "o": ["The moon", "A mulberry", "A fire", "A sunrise"], "a": 1}, {"q": "What sign led Polyidus to Glaucus?", "o": ["A rainbow over the palace", "A snake in the garden", "An owl chasing bees away from a storeroom", "A dog barking at a door"], "a": 2}, {"q": "What did Minos do when Polyidus found Glaucus too late?", "o": ["He banished Polyidus from Crete", "He sealed him in the tomb and ordered him to bring the boy back to life", "He made Polyidus his royal seer", "He sent him to Delphi"], "a": 1}, {"q": "How did Polyidus learn about the healing herb?", "o": ["Athena told him in a dream", "He read about it in a scroll", "A snake used it to revive another snake", "Glaucus whispered it to him"], "a": 2}, {"q": "What did Minos make Polyidus do before he could leave Crete?", "o": ["Build a new palace", "Teach Glaucus the art of prophecy", "Find the Minotaur", "Pay a fortune in gold"], "a": 1}, {"q": "Glaucus remembered everything Polyidus taught him.", "o": ["True", "False"], "a": 1, "why": "He forgot it all after spitting into Polyidus’s mouth."}], "id": "polyidus", "glyph": "serpent", "hero": "Polyidus", "thread": "The healing herb", "hint": "Use your seer's sight on the boy. What you see trailing from him was cut too soon.", "order": ["Glaucus falls into a jar of honey", "An oracle tells Minos about the three-colored calf", "Polyidus compares the calf to a mulberry", "An owl chasing bees leads Polyidus to the storeroom", "Minos seals Polyidus in the tomb with the boy", "A snake revives its companion with an herb", "Glaucus spits into Polyidus's mouth and forgets prophecy"]}, {"n": 12, "name": "Alcyone and Ceyx", "tier": 4, "tierName": "Oracle", "myth": "Alcyone was the daughter of Aeolus, the keeper of the winds, and she was married to Ceyx, the king of Trachis and son of the Morning Star. They loved each other deeply. When troubling signs worried Ceyx, he decided to sail across the sea to ask an oracle of Apollo for advice. Alcyone begged him not to go. Growing up in her father’s house, she knew how fierce and wild the winds could be. When he insisted, she begged to go with him, but he promised he would return before the moon had grown full twice. Alcyone watched from the shore until his sails disappeared. That night, a terrible storm struck. Waves crashed over the ship, the mast snapped, and Ceyx was lost at sea, with Alcyone’s name on his lips. Not knowing what had happened, Alcyone prayed to Hera every day for his safe return and wove new robes for him to wear when he came home. Hera couldn’t bear to hear her prayers for someone who was already gone, so she sent her messenger, Iris, to the dark cave of Hypnos, the god of sleep. Hypnos sent his son Morpheus, the shaper of dreams, who appeared to Alcyone in a dream in the form of Ceyx, pale and dripping with seawater, and told her the truth. At dawn, she rushed to the shore where she had last seen him and saw his body drifting in on the waves. She leaped toward him from the breakwater, and as she did, she became a bird, flying low over the water. The gods, moved by their love, turned Ceyx into a bird too, and the two kingfishers flew off together. Every winter, while Alcyone builds her nest on the sea, her father Aeolus calms the winds for seven days. These peaceful days are still called the “halcyon days.”", "cards": [{"t": "Alcyone", "d": "The daughter of Aeolus and wife of Ceyx, who was turned into a kingfisher."}, {"t": "Ceyx", "d": "The king of Trachis and son of the Morning Star, who was lost at sea."}, {"t": "Aeolus", "d": "The keeper of the winds and Alcyone’s father."}, {"t": "The promise", "d": "Ceyx promised to return before the moon grew full twice."}, {"t": "The storm", "d": "The storm that wrecked Ceyx’s ship on his journey to the oracle."}, {"t": "Hera", "d": "The queen of the gods, who heard Alcyone’s prayers and sent help."}, {"t": "Hypnos", "d": "The god of sleep, who lived in a dark, silent cave."}, {"t": "Morpheus", "d": "The son of Hypnos and shaper of dreams, who appeared to Alcyone in the form of Ceyx."}, {"t": "The kingfishers", "d": "The birds Alcyone and Ceyx were turned into."}, {"t": "Halcyon days", "d": "Seven calm days each winter when Aeolus stills the winds while Alcyone nests on the sea."}], "quiz": [{"q": "Who was Alcyone’s father?", "o": ["Zeus", "Poseidon", "Aeolus, keeper of the winds", "Helios"], "a": 2}, {"q": "Why did Ceyx go to sea?", "o": ["To fight in a war", "To ask an oracle of Apollo for advice", "To find treasure", "To escape from Alcyone’s father"], "a": 1}, {"q": "What did Ceyx promise Alcyone?", "o": ["To bring her a gift from the oracle", "To return before the moon grew full twice", "To write to her every day", "To never sail again"], "a": 1}, {"q": "What did Alcyone do every day while waiting?", "o": ["Watched the sea from a tower", "Prayed to Hera and wove robes for Ceyx", "Sailed out to look for him", "Asked her father to calm the winds"], "a": 1}, {"q": "Who told Alcyone what had happened to Ceyx?", "o": ["Iris", "Hera", "Hermes", "Morpheus, in a dream"], "a": 3}, {"q": "What form did Morpheus take?", "o": ["A seabird", "A sailor from the ship", "Ceyx, pale and dripping with seawater", "Alcyone’s father"], "a": 2}, {"q": "What did Alcyone and Ceyx become?", "o": ["Two stars", "Two kingfishers", "Two dolphins", "Two trees"], "a": 1}, {"q": "The “halcyon days” are seven calm days in winter.", "o": ["True", "False"], "a": 0, "why": "Aeolus calms the winds while Alcyone nests on the sea."}], "id": "alcyone", "glyph": "kingfisher", "hero": "Alcyone", "thread": "Halcyon days", "hint": "On the last nights at the loom, a thread appears that Alcyone never spun.", "order": ["Ceyx decides to sail to an oracle of Apollo", "Alcyone begs him not to go", "Ceyx promises to return before the moon is full twice", "A storm wrecks the ship and Ceyx is lost", "Hera sends Iris to the cave of Hypnos", "Morpheus appears to Alcyone in the form of Ceyx", "Alcyone and Ceyx become kingfishers"]}];
// ================= helpers =================
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad2 = n => String(n).padStart(2, '0');
function toast(msg, ms = 2600) {
  const t = el('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t); setTimeout(() => t.remove(), ms);
}
function showScreen(id) {
  document.querySelectorAll('#stage > .screen').forEach(s => s.hidden = s.id !== id);
}
function modal(build) {
  return new Promise(resolve => {
    const bg = el('div', { class: 'modal-bg' });
    const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
    bg.append(box); document.body.append(bg);
    const close = v => { bg.remove(); resolve(v); };
    build(box, close);
    const f = box.querySelector('input,button'); f && f.focus();
  });
}
function confirmBox(title, text, yes = 'Yes', no = 'Cancel') {
  return modal((box, close) => {
    box.append(el('h3', {}, title), el('p', { class: 'muted' }, text),
      el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: () => close(true) }, yes), el('button', { class: 'btn ghost', onclick: () => close(false) }, no)));
  });
}

};
const EMBLEMS = [['owl', 'Owl'], ['laurel', 'Laurel'], ['trident', 'Trident'], ['lyre', 'Lyre'], ['bow', 'Bow'], ['serpent', 'Serpent']];
const SEAL_WORDS = ['Owl', 'Laurel', 'Trident', 'Lyre', 'Olive', 'Helm', 'Spear', 'Amphora', 'Torch', 'Dolphin', 'Serpent', 'Wheat', 'Raven', 'Shell', 'Pillar', 'Sandal', 'Anchor', 'Harp', 'Comet', 'Ember', 'Fig', 'Lantern', 'Oar', 'Quiver'];

// ================= save system: the Oracle's Ledger =================
const LS_KEY = 'moira.ledger.v1';
let ledger = { slots: [null, null, null], last: null };
let S = null;          // active save
let slotIdx = null;
function lsRead() { try { const r = localStorage.getItem(LS_KEY); if (r) ledger = Object.assign(ledger, JSON.parse(r)); } catch (e) { } }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(ledger)); } catch (e) { } }
function newSave(name, patron, emblem) {
  return { v: 1, name, patron, emblem, seal: makeSeal(), pin: null, created: Date.now(),
    visions: {}, studied: {}, quizBest: {}, bonus: {}, pos: 0, journalOpened: false };
}
function makeSeal() {
  const w = shuffle(SEAL_WORDS).slice(0, 3);
  return `${w[0]}-${w[1]}-${w[2]}-${10 + (Math.random() * 90 | 0)}`;
}
const sealKey = code => code.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
let dbRef = null, dbTried = false, dbWritable = true;
async function getDb() {
  if (dbTried) return dbRef;
  dbTried = true;
  try { dbRef = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { dbRef = null; }
  return dbRef;
}
let cloudTimer = null;
function save(cloud = false) {
  if (!S) return;
  ledger.slots[slotIdx] = S; ledger.last = slotIdx; lsWrite();
  if (cloud) { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushSeal, 1200); }
}
async function pushSeal() {
  const db = await getDb();
  if (!db || !dbWritable || !S) return;
  try { await db.doc('seals/' + sealKey(S.seal)).set({ save: JSON.stringify(S), at: Date.now() }); }
  catch (e) { if (e && e.code === 'invalid_argument') dbWritable = false; }
}
async function pullSeal(code) {
  const db = await getDb();
  if (!db) return { err: 'nodb' };
  try {
    const snap = await db.doc('seals/' + sealKey(code)).get();
    if (!snap.exists) return { err: 'missing' };
    return { save: JSON.parse(snap.data().save) };
  } catch (e) { return { err: 'fail' }; }
}
const doneCount = () => Object.values(S.visions).filter(v => v.done).length;
const threadCount = () => Object.values(S.visions).filter(v => v.thread).length;
const isDone = n => !!(S.visions[n] && S.visions[n].done);
const hasThread = n => !!(S.visions[n] && S.visions[n].thread);
function markStudied(n, idx) {
  const a = S.studied[n] = S.studied[n] || [];
  if (!a.includes(idx)) { a.push(idx); save(true); }
}

// ================= intro: gold & smoke =================
let smokeRAF = null;
function startSmoke() {
  const cv = $('#smoke'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, parts = [];
  const resize = () => { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; };
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 70; i++) parts.push(spawn(true));
  function spawn(init) {
    return { x: W * (0.3 + Math.random() * 0.4), y: init ? Math.random() * H : H + 40, r: (40 + Math.random() * 120) * devicePixelRatio,
      vy: -(0.3 + Math.random() * 0.7) * devicePixelRatio, ph: Math.random() * 6.28, gold: Math.random() < 0.3, a: 0.008 + Math.random() * 0.016 };
  }
  function frame(t) {
    ctx.fillStyle = 'rgba(12,14,17,0.35)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      p.y += p.vy; p.x += Math.sin(t / 2000 + p.ph) * 0.6 * devicePixelRatio; p.r *= 1.0012;
      if (p.y < -p.r) Object.assign(p, spawn(false));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, p.gold ? `rgba(228,182,75,${p.a * 1.6})` : `rgba(160,160,150,${p.a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if (!reduce) smokeRAF = requestAnimationFrame(frame);
  }
  ctx.fillStyle = '#0c0e11'; ctx.fillRect(0, 0, W, H);
  if (reduce) { for (let i = 0; i < 30; i++) frame(i * 50); } else smokeRAF = requestAnimationFrame(frame);
}
function stopSmoke() { cancelAnimationFrame(smokeRAF); }

const P1MAP = [

function telegraphFight(api, host, cfg) {

    let lives = cfg.lives, hits = 0, ammo = cfg.ammo, state = 'idle', windowEnd = 0, cur = null, over = false, fakes = 0;

    const foe = el('div', { style: 'font-family:var(--f-display);font-size:22px;color:var(--ember)' }, cfg.foe);
    const sign = el('div', { style: 'font-size:18px;min-height:2.6em' });
    const bar = el('div', { class: 'meter ember', style: 'width:80%' }, el('i'));
    stage.append(foe, sign, bar);
    const btns = el('div', { class: 'plates', style: 'grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,480px)' });
    const actionBtns = cfg.actions.map(a => { const b = el('button', { class: 'tile', style: 'text-align:center;font-size:15px' }, a); b.onclick = () => act(a); btns.append(b); return b; });
    host.append(el('div', { class: 'chips' }, lifeChip, hitChip), stage, btns);
    const upd = () => { lifeChip.textContent = `${cfg.livesName || 'Health'}: ${'♥'.repeat(Math.max(0, lives))}`; hitChip.textContent = `${cfg.strike.label}: ${hits}/${cfg.strike.needed}` + (ammo != null ? ` · ${cfg.ammoName}: ${ammo}` : ''); };
    upd();
    const speed = cfg.speed || 1;
    function next() {
      if (over) return;
      if (hits >= cfg.strike.needed) { if (cfg.finisher) finisher(); else win(); return; }
      state = 'idle'; sign.textContent = cfg.idle || '…'; setBar(bar, 0);
      api.later(() => {
        if (over) return;

    function attack(a) {

    }

    }

    function hurt(msg) { if (over) return; lives--; tone(140, 0.3, 'sawtooth', 0.05); api.caption(msg); upd(); if (lives <= 0) { over = true; done({ lost: true }); return; } state = 'hurt'; api.later(next, 900); }

    }

    }

  });

function starTrace(api, host, opts) {
  // show a pattern of n stars, then tap them in order. resolves true/false
  return new Promise(done => {
    const box = el('div', { style: 'position:relative;width:min(100%,440px);aspect-ratio:4/3;background:#070912;border-radius:6px;border:1px solid #2a2f40' });
    const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('viewBox', '0 0 100 75'); svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none'; box.append(svg);
    const stars = []; while (stars.length < 14) { const s = [8 + Math.random() * 84, 8 + Math.random() * 59]; if (stars.every(q => Math.hypot(q[0] - s[0], q[1] - s[1]) > 11)) stars.push(s); }
    const route = shuffle(stars.map((_, i) => i)).slice(0, opts.n);
    host.append(box);
    let input = 0, showing = true;
    const line = n => { svg.innerHTML = ''; const p = document.createElementNS(svgNS, 'polyline'); p.setAttribute('points', route.slice(0, n).map(i => stars[i].join(',')).join(' ')); p.setAttribute('fill', 'none'); p.setAttribute('stroke', opts.color || '#e4b64b'); p.setAttribute('stroke-width', '0.8'); svg.append(p); };
    stars.forEach(([x, y], i) => { const b = el('button', { 'aria-label': `Star ${i + 1}`, style: `position:absolute;left:${x}%;top:${y / 75 * 100}%;width:32px;height:32px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:radial-gradient(circle,#fff 0 3px,#fff4 4px,transparent 9px)` });
      b.onclick = () => { if (showing) return; if (i === route[input]) { input++; line(input); tone(500 + input * 50, 0.12); if (input === route.length) { box.remove(); done(true); } } else { box.remove(); done(false); } };
      box.append(b); });
    (async () => {
      for (let k = 1; k <= route.length; k++) { line(k); await sleep(opts.step || 450); }
      await sleep(600); svg.innerHTML = ''; showing = false; box.dataset.ready = 1;
    })();
    box.dataset.route = route.map(i => stars[i].join(',')).join(' ');
  });
}
